version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: examsystem_db
    restart: always
    environment:
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: examadminpassword
      POSTGRES_DB: ExaminationSystemDb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
